<html lang="id">

<style>html{color-scheme:light}body{margin:0}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: satu kolom seperti halaman buku tulis kotak-kotak; pilih topik di atas, isi angka, hasil dan langkah di bawah. */
:root {
  --bg: #F2F5FB;
  --surface: #FFFFFF;
  --ink: #13203F;
  --muted: #5A6A8C;
  --line: #D5DDEC;
  --accent: #2547C8;
  --accent-ink: #FFFFFF;
  --mark: #D63C2B;
  --grid: rgba(37, 71, 200, 0.07);
  --hero-bg: #EAF0FF;
  --err: #B3261E;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1424; --surface: #161E34; --ink: #E7ECFA; --muted: #93A1C4; --line: #27324F;
    --accent: #7C98FF; --accent-ink: #0E1424; --mark: #FF7F6E; --grid: rgba(124, 152, 255, 0.07);
    --hero-bg: #1B2748; --err: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1424; --surface: #161E34; --ink: #E7ECFA; --muted: #93A1C4; --line: #27324F;
  --accent: #7C98FF; --accent-ink: #0E1424; --mark: #FF7F6E; --grid: rgba(124, 152, 255, 0.07);
  --hero-bg: #1B2748; --err: #FF8A80; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-width: 0; }

header h1 { font-size: 1.55rem; line-height: 1.2; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-inline: -2px; padding-inline: 2px; scrollbar-width: thin; }
.tab {
  flex: none; font: inherit; font-size: 0.85rem; font-weight: 500;
  padding: 8px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel h2 { font-size: 1.1rem; margin: 0; font-weight: 600; }
.formula { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); margin: 2px 0 0; overflow-wrap: anywhere; }

.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.field input, .field select {
  font: inherit; font-family: var(--font-mono); font-size: 1rem;
  width: 100%; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.actions { display: flex; gap: 8px; }
.ghost {
  font: inherit; font-size: 0.82rem; padding: 7px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--accent);
}

.result { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hero { background: var(--hero-bg); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hero .hl { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.hero strong { font-family: var(--font-mono); font-weight: 500; font-size: 1.45rem; line-height: 1.35; color: var(--mark); overflow-wrap: anywhere; }
.rows { margin: 0; display: grid; grid-template-columns: 1fr; }
.rows div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.rows dt { color: var(--muted); font-size: 0.88rem; }
.rows dd { margin: 0; font-family: var(--font-mono); font-size: 0.92rem; text-align: right; overflow-wrap: anywhere; min-width: 0; }
.result h3 { margin: 4px 0 0; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.steps { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 10px; }
.steps li { padding-left: 4px; min-width: 0; overflow-wrap: anywhere; }
.steps li::marker { color: var(--mark); font-family: var(--font-mono); }
.m { font-family: var(--font-mono); font-size: 0.88em; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; display: inline-block; max-width: 100%; overflow-wrap: anywhere; }
.msg { margin: 0; color: var(--muted); }
.err { margin: 0; color: var(--err); font-weight: 500; }
footer { font-size: 0.78rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .tab { transition: background 0.15s, color 0.15s; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Kalkulator Matematika Kelas 9</h1>
    <p>Isi angkanya, hasil dan langkah pengerjaannya langsung muncul.</p>
  </header>
  <div class="tabs" role="tablist" id="tabs" aria-label="Pilih topik"></div>
  <section class="panel" id="panel" aria-live="polite">
    <div>
      <h2 id="t-title"></h2>
      <p class="formula" id="t-formula"></p>
    </div>
    <div class="form" id="form"></div>
    <div class="actions"><button type="button" class="ghost" id="reset">Kembalikan contoh</button></div>
    <div class="result" id="out"></div>
  </section>
  <footer>Hasil dibulatkan sampai 4 angka di belakang koma. Cocokkan dengan hitunganmu sendiri sebelum dikumpulkan.</footer>
</div>

<script>
const nf = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 4 });
const fmt = n => { const r = Math.round(n * 1e4) / 1e4; return nf.format(r === 0 ? 0 : r); };
const p = n => (n < 0 ? '(' + fmt(n) + ')' : fmt(n));
const m = s => '<span class="m">' + s + '</span>';
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
const isInt = n => Number.isInteger(n);
const PI_OPTS = { '22/7': 22 / 7, '3,14': 3.14, 'π': Math.PI };
const med = arr => { const n = arr.length; if (!n) return NaN; return n % 2 ? arr[(n - 1) / 2] : (arr[n / 2 - 1] + arr[n / 2]) / 2; };

const TOPICS = [
  {
    id: 'kuadrat', label: 'Persamaan Kuadrat', title: 'Persamaan Kuadrat', formula: 'ax² + bx + c = 0   D = b² − 4ac',
    fields: [
      { id: 'a', label: 'a', type: 'num', def: '1' },
      { id: 'b', label: 'b', type: 'num', def: '-5' },
      { id: 'c', label: 'c', type: 'num', def: '6' }
    ],
    calc(v) {
      const { a, b, c } = v;
      if (a === 0) return { err: 'Nilai a tidak boleh 0. Kalau a = 0, bentuknya bukan persamaan kuadrat.' };
      const D = b * b - 4 * a * c;
      const steps = [
        'Samakan dengan bentuk umum ' + m('ax² + bx + c = 0') + '. Didapat ' + m('a = ' + fmt(a) + ', b = ' + fmt(b) + ', c = ' + fmt(c)) + '.',
        'Hitung diskriminan: ' + m('D = b² − 4ac = ' + p(b) + '² − 4·' + p(a) + '·' + p(c) + ' = ' + fmt(D)) + '.'
      ];
      const rows = [{ k: 'Diskriminan (D)', v: fmt(D) }];
      let hero;
      if (D > 0) {
        const s = Math.sqrt(D), x1 = (-b + s) / (2 * a), x2 = (-b - s) / (2 * a);
        steps.push('D > 0, jadi ada dua akar real yang berbeda. Pakai rumus ' + m('x = (−b ± √D) / 2a') + '. Nilai ' + m('√' + fmt(D) + ' = ' + fmt(s)) + '.');
        steps.push('Akar pertama: ' + m('x₁ = (' + fmt(-b) + ' + ' + fmt(s) + ') / ' + fmt(2 * a) + ' = ' + fmt(x1)));
        steps.push('Akar kedua: ' + m('x₂ = (' + fmt(-b) + ' − ' + fmt(s) + ') / ' + fmt(2 * a) + ' = ' + fmt(x2)));
        steps.push('Periksa: ' + m('x₁ + x₂ = −b/a = ' + fmt(-b / a)) + ' dan ' + m('x₁ · x₂ = c/a = ' + fmt(c / a)) + '.');
        hero = { label: 'Akar-akar', value: 'x₁ = ' + fmt(x1) + '<br>x₂ = ' + fmt(x2) };
        rows.push({ k: 'Jumlah akar (−b/a)', v: fmt(-b / a) }, { k: 'Hasil kali akar (c/a)', v: fmt(c / a) });
      } else if (D === 0) {
        const x = -b / (2 * a);
        steps.push('D = 0, jadi ada satu akar real (akar kembar). Pakai ' + m('x = −b / 2a = ' + fmt(-b) + ' / ' + fmt(2 * a) + ' = ' + fmt(x)) + '.');
        hero = { label: 'Akar kembar', value: 'x = ' + fmt(x) };
      } else {
        steps.push('D < 0, jadi persamaan ini tidak punya akar real.');
        hero = { label: 'Akar real', value: 'Tidak ada' };
      }
      return { hero, rows, steps };
    }
  },
  {
    id: 'fungsi', label: 'Fungsi Kuadrat', title: 'Fungsi Kuadrat', formula: 'y = ax² + bx + c   puncak (−b/2a , −D/4a)',
    fields: [
      { id: 'a', label: 'a', type: 'num', def: '1' },
      { id: 'b', label: 'b', type: 'num', def: '-4' },
      { id: 'c', label: 'c', type: 'num', def: '3' }
    ],
    calc(v) {
      const { a, b, c } = v;
      if (a === 0) return { err: 'Nilai a tidak boleh 0. Kalau a = 0, grafiknya garis lurus, bukan parabola.' };
      const D = b * b - 4 * a * c, xp = -b / (2 * a), yp = -D / (4 * a);
      const steps = [
        'Dari ' + m('y = ' + fmt(a) + 'x² + ' + p(b) + 'x + ' + p(c)) + ', parabola terbuka ke ' + (a > 0 ? 'atas (a > 0), sehingga puncaknya titik minimum.' : 'bawah (a < 0), sehingga puncaknya titik maksimum.'),
        'Sumbu simetri: ' + m('x = −b / 2a = ' + fmt(-b) + ' / ' + fmt(2 * a) + ' = ' + fmt(xp)) + '.',
        'Diskriminan: ' + m('D = b² − 4ac = ' + fmt(D)) + '. Nilai puncak: ' + m('y = −D / 4a = ' + fmt(-D) + ' / ' + fmt(4 * a) + ' = ' + fmt(yp)) + '.',
        'Titik potong sumbu y: masukkan x = 0, didapat ' + m('(0, ' + fmt(c) + ')') + '.'
      ];
      let xr;
      if (D > 0) {
        const s = Math.sqrt(D), x1 = (-b + s) / (2 * a), x2 = (-b - s) / (2 * a);
        xr = '(' + fmt(Math.min(x1, x2)) + ', 0) dan (' + fmt(Math.max(x1, x2)) + ', 0)';
        steps.push('Titik potong sumbu x: selesaikan ' + m('ax² + bx + c = 0') + ' dan didapat ' + m('x = ' + fmt(Math.min(x1, x2)) + ' atau x = ' + fmt(Math.max(x1, x2))) + '.');
      } else if (D === 0) {
        xr = '(' + fmt(xp) + ', 0)';
        steps.push('D = 0, jadi parabola menyentuh sumbu x di satu titik, ' + m('(' + fmt(xp) + ', 0)') + '.');
      } else {
        xr = 'Tidak memotong';
        steps.push('D < 0, jadi parabola tidak memotong sumbu x.');
      }
      return {
        hero: { label: 'Titik puncak', value: '(' + fmt(xp) + ' , ' + fmt(yp) + ')' },
        rows: [
          { k: 'Sumbu simetri', v: 'x = ' + fmt(xp) },
          { k: a > 0 ? 'Nilai minimum' : 'Nilai maksimum', v: fmt(yp) },
          { k: 'Potong sumbu y', v: '(0, ' + fmt(c) + ')' },
          { k: 'Potong sumbu x', v: xr }
        ],
        steps
      };
    }
  },
  {
    id: 'pangkat', label: 'Pangkat', title: 'Bilangan Berpangkat', formula: 'aⁿ = a × a × … (n kali)   a⁻ⁿ = 1 / aⁿ   a⁰ = 1',
    fields: [
      { id: 'a', label: 'Bilangan pokok (a)', type: 'num', def: '2' },
      { id: 'n', label: 'Pangkat (n, bulat)', type: 'num', def: '-3' }
    ],
    calc(v) {
      const { a, n } = v;
      if (!isInt(n) || Math.abs(n) > 30) return { err: 'Pangkat harus bilangan bulat antara −30 dan 30.' };
      if (a === 0 && n <= 0) return { err: '0 dipangkatkan 0 atau pangkat negatif tidak terdefinisi.' };
      const k = Math.abs(n), steps = [];
      const expand = (cnt) => {
        const list = Array.from({ length: Math.min(cnt, 6) }, () => p(a)).join(' × ');
        return cnt > 6 ? list + ' × …' : list;
      };
      let hero, val = Math.pow(a, n);
      if (n === 0) {
        steps.push('Bilangan apa pun (selain 0) dipangkatkan 0 hasilnya 1. Jadi ' + m(p(a) + '⁰ = 1') + '.');
        hero = { label: 'Hasil', value: '1' };
      } else if (n > 0) {
        steps.push('Kalikan ' + fmt(a) + ' sebanyak ' + n + ' kali: ' + m(expand(n)) + '.');
        steps.push('Hasilnya ' + m(p(a) + '<sup>' + n + '</sup> = ' + fmt(val)) + '.');
        hero = { label: 'Hasil', value: fmt(val) };
      } else {
        steps.push('Pangkat negatif berarti kebalikan: ' + m(p(a) + '<sup>' + n + '</sup> = 1 / ' + p(a) + '<sup>' + k + '</sup>') + '.');
        steps.push('Hitung penyebutnya: ' + m(p(a) + '<sup>' + k + '</sup> = ' + fmt(Math.pow(a, k))) + '.');
        steps.push('Jadi hasilnya ' + m('1 / ' + fmt(Math.pow(a, k)) + ' = ' + fmt(val)) + '.');
        hero = { label: 'Hasil', value: (isInt(a) ? '1/' + fmt(Math.pow(a, k)) + ' = ' : '') + fmt(val) };
      }
      return { hero, rows: [], steps };
    }
  },
  {
    id: 'akar', label: 'Bentuk Akar', title: 'Menyederhanakan Bentuk Akar', formula: '√(a² × b) = a√b',
    fields: [{ id: 'n', label: 'Bilangan di dalam akar', type: 'num', def: '72' }],
    calc(v) {
      const n = v.n;
      if (!isInt(n) || n < 1 || n > 1e12) return { err: 'Masukkan bilangan bulat positif sampai 1.000.000.000.000.' };
      let a = 1;
      for (let i = Math.floor(Math.sqrt(n)); i >= 1; i--) { if (n % (i * i) === 0) { a = i; break; } }
      const b = n / (a * a), dec = Math.sqrt(n);
      const steps = [];
      if (a === 1) {
        steps.push('Cari faktor kuadrat sempurna (4, 9, 16, 25, …) yang membagi ' + fmt(n) + '. Tidak ada selain 1.');
        steps.push('Jadi ' + m('√' + fmt(n)) + ' sudah paling sederhana.');
        return { hero: { label: 'Bentuk paling sederhana', value: '√' + fmt(n) }, rows: [{ k: 'Nilai pendekatan', v: fmt(dec) }], steps };
      }
      steps.push('Cari kuadrat sempurna terbesar yang membagi ' + fmt(n) + '. Ketemu ' + m(fmt(a * a) + ' = ' + fmt(a) + '²') + '.');
      steps.push('Tulis ' + m(fmt(n) + ' = ' + fmt(a * a) + ' × ' + fmt(b)) + '.');
      steps.push('Keluarkan akarnya: ' + m('√' + fmt(n) + ' = √' + fmt(a * a) + ' × √' + fmt(b) + ' = ' + fmt(a) + '√' + fmt(b)) + '.');
      const hv = b === 1 ? fmt(a) : fmt(a) + '√' + fmt(b);
      return { hero: { label: 'Bentuk paling sederhana', value: hv }, rows: [{ k: 'Nilai pendekatan', v: fmt(dec) }], steps };
    }
  },
  {
    id: 'ruang', label: 'Bangun Ruang', title: 'Bangun Ruang Sisi Lengkung', formula: 'Tabung · Kerucut · Bola',
    fields: [
      { id: 'shape', label: 'Bangun', type: 'select', def: 'tabung', wide: true, options: [['tabung', 'Tabung'], ['kerucut', 'Kerucut'], ['bola', 'Bola']] },
      { id: 'r', label: 'Jari-jari (r)', type: 'num', def: '7' },
      { id: 't', label: 'Tinggi (t)', type: 'num', def: '10', show: v => v.shape !== 'bola' },
      { id: 'pi', label: 'Nilai π', type: 'select', def: '22/7', options: [['22/7', '22/7'], ['3,14', '3,14'], ['π', 'π kalkulator']] }
    ],
    calc(v) {
      const { shape, r, t } = v, PI = PI_OPTS[v.pi], pl = v.pi === 'π' ? 'π' : v.pi;
      if (r <= 0) return { err: 'Jari-jari harus lebih dari 0.' };
      if (shape !== 'bola' && t <= 0) return { err: 'Tinggi harus lebih dari 0.' };
      const steps = [], rows = [];
      let hero;
      if (shape === 'tabung') {
        const V = PI * r * r * t, L = 2 * PI * r * (r + t), S = 2 * PI * r * t;
        steps.push('Volume: ' + m('V = π r² t = ' + pl + ' × ' + p(r) + '² × ' + p(t) + ' = ' + fmt(V)));
        steps.push('Luas selimut: ' + m('2π r t = 2 × ' + pl + ' × ' + p(r) + ' × ' + p(t) + ' = ' + fmt(S)));
        steps.push('Luas permukaan: ' + m('2π r (r + t) = 2 × ' + pl + ' × ' + p(r) + ' × (' + fmt(r) + ' + ' + fmt(t) + ') = ' + fmt(L)));
        hero = { label: 'Volume tabung', value: fmt(V) };
        rows.push({ k: 'Luas permukaan', v: fmt(L) }, { k: 'Luas selimut', v: fmt(S) });
      } else if (shape === 'kerucut') {
        const s = Math.sqrt(r * r + t * t), V = PI * r * r * t / 3, S = PI * r * s, L = PI * r * (r + s);
        steps.push('Garis pelukis: ' + m('s = √(r² + t²) = √(' + fmt(r * r) + ' + ' + fmt(t * t) + ') = ' + fmt(s)));
        steps.push('Volume: ' + m('V = ⅓ π r² t = ⅓ × ' + pl + ' × ' + p(r) + '² × ' + p(t) + ' = ' + fmt(V)));
        steps.push('Luas selimut: ' + m('π r s = ' + pl + ' × ' + p(r) + ' × ' + fmt(s) + ' = ' + fmt(S)));
        steps.push('Luas permukaan: ' + m('π r (r + s) = ' + pl + ' × ' + p(r) + ' × (' + fmt(r) + ' + ' + fmt(s) + ') = ' + fmt(L)));
        hero = { label: 'Volume kerucut', value: fmt(V) };
        rows.push({ k: 'Luas permukaan', v: fmt(L) }, { k: 'Luas selimut', v: fmt(S) }, { k: 'Garis pelukis (s)', v: fmt(s) });
      } else {
        const V = 4 * PI * r * r * r / 3, L = 4 * PI * r * r;
        steps.push('Volume: ' + m('V = 4/3 π r³ = 4/3 × ' + pl + ' × ' + p(r) + '³ = ' + fmt(V)));
        steps.push('Luas permukaan: ' + m('L = 4π r² = 4 × ' + pl + ' × ' + p(r) + '² = ' + fmt(L)));
        hero = { label: 'Volume bola', value: fmt(V) };
        rows.push({ k: 'Luas permukaan', v: fmt(L) });
      }
      steps.push('Satuan mengikuti panjang yang kamu pakai, misalnya cm³ untuk volume dan cm² untuk luas.');
      return { hero, rows, steps };
    }
  },
  {
    id: 'statistika', label: 'Statistika', title: 'Statistika Data Tunggal', formula: 'rata-rata · median · modus · jangkauan · kuartil',
    fields: [{ id: 'data', label: 'Data (pisahkan dengan spasi atau koma)', type: 'text', def: '7 8 6 9 7 10 7 5', wide: true }],
    calc(v) {
      const arr = String(v.data).split(/[\s,;]+/).filter(Boolean).map(s => Number(s.replace(',', '.')));
      if (!arr.length || arr.some(x => !isFinite(x))) return { err: 'Tulis angka saja, dipisah spasi atau koma. Contoh: 7 8 6 9.' };
      if (arr.length > 200) return { err: 'Maksimal 200 data.' };
      const s = [...arr].sort((x, y) => x - y), n = s.length, sum = s.reduce((x, y) => x + y, 0), mean = sum / n;
      const md = med(s);
      const freq = new Map(); s.forEach(x => freq.set(x, (freq.get(x) || 0) + 1));
      const mx = Math.max(...freq.values());
      const modus = mx === 1 ? 'Tidak ada' : [...freq].filter(([, c]) => c === mx).map(([x]) => fmt(x)).join('; ');
      const lo = s.slice(0, Math.floor(n / 2)), hi = s.slice(Math.ceil(n / 2));
      const q1 = lo.length ? med(lo) : NaN, q3 = hi.length ? med(hi) : NaN;
      const range = s[n - 1] - s[0];
      const list = s.length > 14 ? s.slice(0, 14).map(fmt).join(', ') + ', …' : s.map(fmt).join(', ');
      const steps = [
        'Urutkan data dari kecil ke besar: ' + m(list) + '. Banyak data ' + m('n = ' + n) + '.',
        'Rata-rata = jumlah data ÷ banyak data = ' + m(fmt(sum) + ' / ' + n + ' = ' + fmt(mean)) + '.',
        n % 2
          ? 'Median: data ke-' + ((n + 1) / 2) + ' (tengah) = ' + m(fmt(md)) + '.'
          : 'Median: rata-rata data ke-' + (n / 2) + ' dan ke-' + (n / 2 + 1) + ' = ' + m('(' + fmt(s[n / 2 - 1]) + ' + ' + fmt(s[n / 2]) + ') / 2 = ' + fmt(md)) + '.',
        'Modus: data yang paling sering muncul' + (mx === 1 ? ', tapi semua data muncul sekali, jadi tidak ada modus.' : ' (' + mx + ' kali) = ' + m(modus) + '.'),
        'Jangkauan = data terbesar − data terkecil = ' + m(fmt(s[n - 1]) + ' − ' + fmt(s[0]) + ' = ' + fmt(range)) + '.'
      ];
      if (n >= 2) {
        steps.push('Kuartil: Q₁ = median setengah data bawah = ' + m(fmt(q1)) + ', Q₃ = median setengah data atas = ' + m(fmt(q3)) + '. Jangkauan antarkuartil = ' + m(fmt(q3 - q1)) + '.');
      }
      const rows = [
        { k: 'Median', v: fmt(md) }, { k: 'Modus', v: modus }, { k: 'Jangkauan', v: fmt(range) },
        { k: 'Data terkecil / terbesar', v: fmt(s[0]) + ' / ' + fmt(s[n - 1]) }
      ];
      if (n >= 2) rows.push({ k: 'Q₁ / Q₃', v: fmt(q1) + ' / ' + fmt(q3) });
      return { hero: { label: 'Rata-rata (mean)', value: fmt(mean) }, rows, steps };
    }
  },
  {
    id: 'peluang', label: 'Peluang', title: 'Peluang Kejadian', formula: 'P(A) = n(A) / n(S)   frekuensi harapan = P(A) × banyak percobaan',
    fields: [
      { id: 'na', label: 'Kejadian yang diminta n(A)', type: 'num', def: '2' },
      { id: 'ns', label: 'Semua kemungkinan n(S)', type: 'num', def: '6' },
      { id: 'n', label: 'Banyak percobaan', type: 'num', def: '60' }
    ],
    calc(v) {
      const { na, ns, n } = v;
      if (!isInt(na) || !isInt(ns) || ns < 1 || na < 0) return { err: 'n(A) dan n(S) harus bilangan bulat, dan n(S) minimal 1.' };
      if (na > ns) return { err: 'n(A) tidak boleh lebih besar dari n(S).' };
      if (n < 0) return { err: 'Banyak percobaan tidak boleh negatif.' };
      const g = gcd(na, ns) || 1, pn = na / g, pd = ns / g, P = na / ns, fh = P * n;
      const frac = pd === 1 ? String(pn) : pn + '/' + pd;
      const steps = [
        'Rumus peluang: ' + m('P(A) = n(A) / n(S) = ' + fmt(na) + ' / ' + fmt(ns)) + '.',
        'Sederhanakan pecahan: ' + m(fmt(na) + '/' + fmt(ns) + ' = ' + frac) + ' (dibagi ' + g + ').',
        'Dalam desimal dan persen: ' + m(fmt(P)) + ' atau ' + m(fmt(P * 100) + '%') + '.',
        'Peluang komplemen (A tidak terjadi): ' + m('1 − ' + frac + ' = ' + fmt(1 - P)) + '.',
        'Frekuensi harapan dalam ' + fmt(n) + ' percobaan: ' + m('P(A) × n = ' + fmt(P) + ' × ' + fmt(n) + ' = ' + fmt(fh)) + ' kali.'
      ];
      return {
        hero: { label: 'Peluang P(A)', value: frac },
        rows: [{ k: 'Desimal', v: fmt(P) }, { k: 'Persen', v: fmt(P * 100) + '%' }, { k: 'Komplemen', v: fmt(1 - P) }, { k: 'Frekuensi harapan', v: fmt(fh) + ' kali' }],
        steps
      };
    }
  },
  {
    id: 'sebangun', label: 'Kesebangunan', title: 'Kesebangunan', formula: 'sisi bersesuaian: a₁/b₁ = a₂/b₂   luas ∝ k²   volume ∝ k³',
    fields: [
      { id: 'a1', label: 'Sisi pada bangun 1', type: 'num', def: '4' },
      { id: 'b1', label: 'Sisi bersesuaian pada bangun 2', type: 'num', def: '6' },
      { id: 'a2', label: 'Sisi lain pada bangun 1', type: 'num', def: '10' }
    ],
    calc(v) {
      const { a1, b1, a2 } = v;
      if (a1 <= 0 || b1 <= 0 || a2 <= 0) return { err: 'Semua panjang sisi harus lebih dari 0.' };
      const k = b1 / a1, b2 = a2 * k;
      const steps = [
        'Sisi yang bersesuaian punya perbandingan sama: ' + m(fmt(a1) + ' / ' + fmt(b1) + ' = ' + fmt(a2) + ' / x') + '.',
        'Kali silang: ' + m(fmt(a1) + ' · x = ' + fmt(b1) + ' · ' + fmt(a2)) + ', jadi ' + m('x = ' + fmt(b1 * a2) + ' / ' + fmt(a1) + ' = ' + fmt(b2)) + '.',
        'Faktor skala bangun 1 ke bangun 2: ' + m('k = ' + fmt(b1) + ' / ' + fmt(a1) + ' = ' + fmt(k)) + '.',
        'Kalau bangunnya bangun datar, perbandingan luasnya ' + m('k² = ' + fmt(k * k)) + '. Kalau bangun ruang, perbandingan volumenya ' + m('k³ = ' + fmt(k * k * k)) + '.'
      ];
      return {
        hero: { label: 'Sisi lain pada bangun 2 (x)', value: fmt(b2) },
        rows: [{ k: 'Faktor skala (k)', v: fmt(k) }, { k: 'Perbandingan luas', v: fmt(k * k) }, { k: 'Perbandingan volume', v: fmt(k * k * k) }],
        steps
      };
    }
  }
];
globalThis.__TOPICS = TOPICS;

if (typeof document !== 'undefined') {
  const $ = s => document.querySelector(s);
  const tabsEl = $('#tabs'), formEl = $('#form'), outEl = $('#out');
  let current = TOPICS[0];

  const parseNum = s => { const t = String(s).trim().replace(',', '.'); return t === '' ? NaN : Number(t); };

  function buildTabs() {
    tabsEl.innerHTML = '';
    TOPICS.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
      b.id = 'tab-' + t.id; b.textContent = t.label;
      b.setAttribute('aria-selected', t === current ? 'true' : 'false');
      b.addEventListener('click', () => { current = t; buildTabs(); buildForm(); run(); });
      tabsEl.append(b);
    });
  }

  function buildForm() {
    $('#t-title').textContent = current.title;
    $('#t-formula').textContent = current.formula;
    formEl.innerHTML = '';
    current.fields.forEach(f => {
      const wrap = document.createElement('div');
      wrap.className = 'field' + (f.wide ? ' wide' : '');
      wrap.dataset.id = f.id;
      const id = 'f-' + current.id + '-' + f.id;
      let control;
      if (f.type === 'select') {
        control = '<select id="' + id + '">' + f.options.map(o => '<option value="' + o[0] + '"' + (o[0] === f.def ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>';
      } else {
        control = '<input id="' + id + '" type="text" inputmode="' + (f.type === 'num' ? 'decimal' : 'text') + '" autocomplete="off" value="' + f.def + '">';
      }
      wrap.innerHTML = '<label for="' + id + '">' + f.label + '</label>' + control;
      wrap.querySelector('input, select').addEventListener('input', run);
      formEl.append(wrap);
    });
  }

  function values() {
    const v = {};
    current.fields.forEach(f => {
      const el = document.getElementById('f-' + current.id + '-' + f.id);
      v[f.id] = f.type === 'num' ? parseNum(el.value) : el.value;
    });
    return v;
  }

  function run() {
    const v = values();
    let missing = false;
    current.fields.forEach(f => {
      const wrap = formEl.querySelector('[data-id="' + f.id + '"]');
      const visible = f.show ? f.show(v) : true;
      wrap.hidden = !visible;
      if (visible && f.type === 'num' && !isFinite(v[f.id])) missing = true;
    });
    if (missing) { outEl.innerHTML = '<p class="msg">Isi semua kolom dengan angka untuk melihat hasilnya.</p>'; return; }
    let res;
    try { res = current.calc(v); } catch (e) { res = { err: 'Angka ini belum bisa dihitung. Coba periksa lagi isiannya.' }; }
    if (res.err) { outEl.innerHTML = '<p class="err">' + res.err + '</p>'; return; }
    outEl.innerHTML =
      '<div class="hero"><span class="hl">' + res.hero.label + '</span><strong>' + res.hero.value + '</strong></div>' +
      (res.rows.length ? '<dl class="rows">' + res.rows.map(r => '<div><dt>' + r.k + '</dt><dd>' + r.v + '</dd></div>').join('') + '</dl>' : '') +
      '<h3>Langkah pengerjaan</h3><ol class="steps">' + res.steps.map(s => '<li>' + s + '</li>').join('') + '</ol>';
  }

  $('#reset').addEventListener('click', () => { buildForm(); run(); });
  buildTabs(); buildForm(); run();
}
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
